name: Validate Docs Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "docs folder is missing!"
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist
        run: |
          test -f docs/ERD.png || (echo "Missing ERD.png" && exit 1)
          test -f docs/endpoint-plan.md || (echo "Missing endpoint-plan.md" && exit 1)
          test -f docs/RaceDay.sql || (echo "Missing RaceDay.sql" && exit 1)
          echo "All required files present."